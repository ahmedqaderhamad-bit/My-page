<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وێنەگرتن</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 30px;
    }

    video, canvas {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      margin: 15px auto;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 25px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #start {
      background: #1677ff;
      color: white;
    }

    #capture {
      background: #16a34a;
      color: white;
      display: none;
    }

    #send {
      background: #111827;
      color: white;
      display: none;
    }

    #status {
      margin: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>📷 وێنەگرتن</h2>

  <p>
    بۆ بەکارهێنانی کامێرا، تکایە ڕەزامەندی خۆت بدە.
  </p>

  <button id="start">دەستپێکردنی کامێرا</button>

  <video id="video" autoplay playsinline></video>

  <canvas id="canvas"></canvas>

  <br>

  <button id="capture">📸 وێنە بگرە</button>

  <button id="send">📤 ناردنی وێنە</button>

  <div id="status"></div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startButton = document.getElementById("start");
    const captureButton = document.getElementById("capture");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");

    let stream = null;
    let photoBlob = null;

    startButton.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        captureButton.style.display = "inline-block";
        status.textContent = "کامێرا چالاکە.";
      } catch (error) {
        status.textContent =
          "نەتوانرا دەستگەیشتن بە کامێرا بدۆزرێتەوە.";
        console.error(error);
      }
    };

    captureButton.onclick = () => {
      const width = video.videoWidth;
      const height = video.videoHeight;

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d");

      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );

      canvas.toBlob((blob) => {
        photoBlob = blob;

        sendButton.style.display = "inline-block";
        status.textContent =
          "وێنەکە گیرا. ئێستا دەتوانیت بینێریت.";
      }, "image/jpeg", 0.9);
    };

    sendButton.onclick = async () => {

      if (!photoBlob) {
        status.textContent = "هیچ وێنەیەک نییە.";
        return;
      }

      const formData = new FormData();

      formData.append(
        "photo",
        photoBlob,
        "photo.jpg"
      );

      try {

        /*
          ئەم URL ـە دەبێت بگۆڕیت بۆ
          API ـی سێرڤەرەکەت.
        */

        const response = await fetch(
          "https://YOUR-SERVER.COM/upload",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error("Upload failed");
        }

        status.textContent =
          "وێنەکە بە سەرکەوتوویی نێردرا.";

      } catch (error) {

        status.textContent =
          "هەڵەیەک لە ناردنی وێنەکە ڕوویدا.";

        console.error(error);
      }
    };
  </script>

</body>
</html>
